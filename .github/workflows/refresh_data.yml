name: Refresh Draft Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python scripts/build_prospects.py

      - name: Refresh post-draft consensus accuracy (most recent completed draft)
        run: |
          LAST_YEAR=$(python -c "from datetime import datetime,timezone;n=datetime.now(timezone.utc);print(n.year if (n.month,n.day)>=(4,25) else n.year-1)")
          if [ -f "data/predraft/${LAST_YEAR}.json" ]; then
            echo "Building consensus accuracy for $LAST_YEAR"
            python scripts/fetch_draft_results.py "$LAST_YEAR"
            python scripts/build_consensus_accuracy.py "$LAST_YEAR"
          else
            echo "No predraft snapshot for $LAST_YEAR yet — skipping consensus accuracy build"
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: daily refresh $(date -u '+%Y-%m-%d')"
            # Retry push up to 3 times
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

      - name: Trigger deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            })
